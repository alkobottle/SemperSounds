services:
  sempersounds:
    build:
      context: .
      args:
        # Set by the deploy script; "unknown" if built by hand without it.
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    image: sempersounds:latest
    container_name: sempersounds
    restart: unless-stopped
    env_file: .env
    environment:
      # Secrets come from .env; everything with a sensible default stays here.
      Soundboard__DataPath: /data
      Soundboard__MaxDurationSeconds: "5"
      Soundboard__MaxUploadBytes: "10485760"
      # Anti-spam valve. 0 disables it; raise if someone abuses the airhorn.
      Soundboard__PerUserCooldownSeconds: "0"
      # Drop out this many seconds after the last human leaves the channel. 0 disables.
      Soundboard__IdleLeaveSeconds: "5"
    volumes:
      # Uploaded sounds and the SQLite database. Without this, everything is lost
      # on the next container rebuild.
      - ./data:/data
    ports:
      # Bound to loopback: the reverse proxy in front of this is what faces the
      # internet. Drop the 127.0.0.1 prefix only if nothing else terminates TLS.
      #
      # The host port is a variable because it is not free on every machine — a Pi-hole
      # admin server holds 8080 on one of them. Set SEMPERSOUNDS_PORT in .env there rather
      # than editing this line, or the local edit makes the git pull in deploy.sh refuse
      # to run. The container side stays 8080 always, which is what the HEALTHCHECK and
      # the reverse proxy upstream both expect.
      - "127.0.0.1:${SEMPERSOUNDS_PORT:-8080}:8080"
